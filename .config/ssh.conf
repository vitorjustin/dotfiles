########
# SSH Agent Auto-launching
# http://bit.ly/3VqL14A
########
env=~/.ssh/agent.env

agent_load_env () { test -f "$env" && . "$env" >| /dev/null ; }

agent_start () {
    (umask 077; ssh-agent >| "$env")
    . "$env" >| /dev/null ; }

agent_load_env

# agent_run_state: 0=agent running w/ key; 1=agent w/o key; 2=agent not running
agent_run_state=$(ssh-add -l >| /dev/null 2>&1; echo $?)

# Only ensure an agent exists. Never run a bare `ssh-add` here: it blocks the
# shell on a passphrase prompt that p10k's instant prompt hides, which eats
# keystrokes until you Ctrl+C. ~/.ssh/config has `AddKeysToAgent yes`, so the
# key is loaded (and the passphrase asked, visibly) on first actual ssh use.
if [ ! "$SSH_AUTH_SOCK" ] || [ $agent_run_state = 2 ]; then
    agent_start
fi

unset env
